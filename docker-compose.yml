version: '3.8'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - APP_SECRET=dev_secret
      - DB_URL=mysql://user:pass@db:3306/users
      - REDIS_ENABLED=false
      - QUEUE_TYPE=celery
      - EMAIL_PROVIDER=smtp
      - NEW_ONBOARDING_FEATURE=false
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=users
