version: '3.8'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=dev_secret
      - DB_URL=postgresql://user:pass@db:5432/users
      - REDIS_ENABLED=false
      - QUEUE_TYPE=celery
      - EMAIL_PROVIDER=smtp
      - NEW_ONBOARDING_FEATURE=false
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=users
