version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=dev_secret
      - DB_URL=postgresql://user:pass@db:5432/users
      - REDIS_ENABLED=true
      - QUEUE_TYPE=asyncio
      - EMAIL_PROVIDER=sendgrid
      - NEW_ONBOARDING_FEATURE=true
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=users
  redis:
    image: redis:7
